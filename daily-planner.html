<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Day Planner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,700&display=swap');
    body {
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      margin: 0;
      padding: 2.5rem 0 2.5rem 0;
      background: #F2F5FF;
      color: #1A1A1A;
      letter-spacing: 0.01em;
    }
    #header {
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-size: 2.3rem;
      font-weight: 700;
      margin-bottom: 2.2rem;
      cursor: text;
      letter-spacing: 0.01em;
      color: #1A1A1A;
      line-height: 1.2;
    }
    #header[contenteditable]:empty:before {
      content: attr(data-placeholder);
      color: #aaa;
    }
    .planner-container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      padding: 0 2rem;
      overflow: visible !important;
    }
    #copyAllBtn {
      position: fixed;
      left: 2rem;
      top: 2rem;
      z-index: 1000;
      padding: 0.6rem 1.4rem;
      background: #1A2B6C;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 0;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      box-shadow: 0 2px 8px #1a2b6c22;
      transition: background 0.15s;
    }
    #copyAllBtn:hover {
      background: #16204a;
    }
    .table-wrapper {
      position: relative;
      margin: 0 0 2.5rem 0;
      padding: 0;
      overflow: visible !important;
    }

    .table-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 2.9rem; /* Ширина колонки удаления */
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 16px #1a2b6c0d;
      border: 1px solid #e5e8f0;
      z-index: -1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin: 0;
      font-size: 1.08rem;
      background: #fff;
    }
    col.handle-col   { width: 2.2rem; }
    col.task-col     { min-width: 15ch; max-width: 15ch; width: 15ch; }
    col.interval-col { width: 11ch; }
    col.duration-col { width: 7ch; }
    col.delete-col   { background: transparent !important; border: none !important; width: 2ch; min-width: 2ch; max-width: 2ch; padding: 0; }
    td.delete-col {
      padding: 0 !important;
      text-align: center;
      width: 4ch !important;
      min-width: 4ch !important;
      max-width: 4ch !important;
      overflow: hidden;
      background: #F2F5FF !important;
      border-left: none !important;
      border-right: none !important;
      border-top: 1px solid #F2F5FF !important;
      border-bottom: 1px solid #F2F5FF !important;
    }
    th, td {
      border: 1px solid #e5e8f0;
      padding: 0.55rem 0.45rem;
      vertical-align: middle;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-size: 0.98rem;
      background: #fff;
    }
    th {
      background: #f5f7fa;
      text-align: left;
      font-weight: 700;
      color: #1A1A1A;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 1.02rem;
      border-bottom: 2px solid #1A2B6C22;
    }
    th.interval-col {
      text-align: center !important;
    }
    th.lock-col {
      text-align: center;
      font-size: 1rem;
      padding: 0;
    }
    td.handle-col {
      text-align: center;
      cursor: move;
      color: #1A2B6C;
      font-size: 1.25rem;
      font-family: 'IBM Plex Mono', 'IBM Plex Sans', monospace;
      background: #f5f7fa;
      border-right: 1px solid #e5e8f0;
    }
    td.task-col {
      white-space: normal;
      overflow-wrap: break-word;
      word-break: break-word;
      min-width: 16ch;
      max-width: 55ch;
      color: #1A1A1A;
      font-size: 0.92rem;
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      vertical-align: middle;
      min-height: 2.1em;
      line-height: 1.3;
      padding-top: 0.2em;
      padding-bottom: 0.2em;
    }
    td.task-col[contenteditable]:empty:before {
      content: attr(data-placeholder);
      color: #aaa;
      opacity: 0.7;
      display: block;
      width: 100%;
      text-align: left;
      line-height: 1.3;
    }
    td.interval-col {
      font-family: 'IBM Plex Mono', 'IBM Plex Sans', monospace;
      color: #1A2B6C;
      background: #f9f9fb;
      padding-left: 0.5ch;
      padding-right: 0.5ch;
      box-sizing: border-box;
      width: 1%;
      overflow: hidden;
      text-align: center;
    }
    td.interval-col input[type="text"] {
      width: 2.75ch;
      text-align: center;
      margin: 0 0.1ch;
    }
    td.duration-col {
      text-align: center;
      padding-left: 0.7ch;
      padding-right: 0.7ch;
      background: #f9f9fb;
      border-right: 1px solid #e5e8f0 !important;
    }
    td.duration-col input[type="number"], input.duration {
      width: 6ch !important;
      min-width: 5ch;
      max-width: 8ch;
      text-align: center;
    }
    input[type="text"], input[type="number"] {
      border: 1px solid #e5e8f0;
      font-size: 0.98rem;
      font-family: 'IBM Plex Mono', 'IBM Plex Sans', monospace;
      background: #fff;
      color: #1A1A1A;
      border-radius: 6px;
      padding: 0.13em 0.35em;
      outline: none;
      transition: border 0.15s;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      border: 1.5px solid #1A2B6C;
      background: #f5f7fa;
    }
    input[type="time"] {
      border: none;
      font-size: 1.08rem;
      width: 9ch;
      font-family: 'IBM Plex Mono', 'IBM Plex Sans', monospace;
      background: #fff;
      color: #1A1A1A;
    }
    .table-buttons {
      display: flex;
      gap: 0.7rem;
      padding: 1.2rem 1.2rem 1.2rem 0.7rem;
      background: none;
      border: none;
      justify-content: flex-start;
      align-items: center;
      position: relative;
      overflow: visible !important;
    }
    .table-buttons button {
      font-family: 'IBM Plex Sans', Arial, sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.97rem;
      border-radius: 8px;
      border: none;
      padding: 0.32em 0.8em;
      background: #f5f7fa;
      color: #1A2B6C;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      box-shadow: 0 1px 4px #1a2b6c0a;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
    .table-buttons button:hover {
      background: #e5e8f0;
      color: #16204a;
    }
    .export-ics-btn {
      background: #1976d2 !important;
      color: #fff !important;
      font-size: 1.05rem !important;
      border-radius: 8px !important;
      padding: 0.32em 0.8em !important;
      box-shadow: 0 2px 8px #1a2b6c22 !important;
      text-transform: none !important;
      font-weight: 700 !important;
      letter-spacing: 0.04em !important;
    }
    .export-ics-btn:hover {
      background: #2B5B97 !important;
      color: #fff !important;
    }
    .auto-fill-btn {
      background: #e3e6f7 !important;
      color: #1A2B6C !important;
      font-size: 1.05rem !important;
      border-radius: 8px !important;
      padding: 0.32em 0.8em !important;
      text-transform: none !important;
      font-weight: 700 !important;
      letter-spacing: 0.04em !important;
    }
    .auto-fill-btn:hover {
      background: #d0d6ee !important;
      color: #16204a !important;
    }
    .invalid {
      background: #ffe6e6;
    }
    tr.placeholder td {
      min-height: 40px;
      height: 40px;
      overflow: hidden;
      padding: 0;
      border: none;
      background: #f3f3f3;
      line-height: 1;
    }
    .delete-row-btn {
      font-size: 0.9rem !important;
      padding: 0 !important;
      margin: 0 !important;
      min-width: 0 !important;
      width: 1em !important;
      height: 1em !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    tbody tr:hover .delete-row-btn,
    .delete-row-btn:hover,
    .delete-row-btn:focus {
      opacity: 1;
    }
    tbody tr {
      position: relative;
      transition: all 0.15s ease-out;
    }
    .remove-table-btn {
      background: #c00 !important;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
    }
    .remove-table-btn:hover {
      background: #a00 !important;
    }
    .custom-time-picker {
      display: flex;
      gap: 0.35rem;
      padding: 0.12rem 0.18rem;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 8px #0002;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 10000;
      font-size: 0.88rem;
      width: max-content;
      max-width: 100vw;
    }
    .picker-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 2ch;
      font-size: 0.88rem;
      user-select: none;
      max-height: 1.9em * 5;
      height: calc(1.9em * 5);
      overflow-y: auto;
      scrollbar-width: none;
    }
    .picker-col::-webkit-scrollbar {
      display: none;
    }
    .picker-item {
      padding: 0.5em 0.5rem;
      cursor: pointer;
      border-radius: 4px;
      margin: 0;
      transition: background 0.15s;
      min-height: 2.1em;
      box-sizing: border-box;
    }
    .picker-item.selected {
      background: #007bff;
      color: #fff;
      font-weight: bold;
    }
    .picker-item:hover {
      background: #e0e0e0;
    }
    .interval-col input.invalid {
      background: #ffe6e6 !important;
      border-radius: 4px;
    }
    .custom-duration-picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.88rem;
      user-select: none;
      max-height: 1.9em * 5;
      height: calc(1.9em * 5);
      overflow-y: auto;
      scrollbar-width: none;
      padding: 0.12rem 0.18rem;
      width: max-content;
      max-width: 100vw;
    }
    .custom-duration-picker::-webkit-scrollbar {
      display: none;
    }
    .duration-picker-item {
      padding: 0.35em 0.4rem;
      cursor: pointer;
      border-radius: 4px;
      margin: 0;
      transition: background 0.15s;
      min-height: 1.9em;
      box-sizing: border-box;
    }
    .duration-picker-item.selected {
      background: #007bff;
      color: #fff;
      font-weight: bold;
    }
    .duration-picker-item:hover {
      background: #e0e0e0;
    }
    .row-delete-btn {
      opacity: 0;
      pointer-events: auto;
      display: flex;
      margin: 0 auto;
      background: none;
      border: none;
      color: #c00;
      font-size: 1.3rem;
      cursor: pointer;
      transition: opacity 0.2s;
      z-index: 10;
      padding: 0.2rem;
      align-items: center;
      justify-content: center;
    }
    tbody tr:hover .row-delete-btn {
      opacity: 1;
    }
    thead th.delete-col {
      background: #F2F5FF !important;
      border: none !important;
      border-top: 1px solid #F2F5FF !important;
      box-shadow: none !important;
    }
    th.duration-col {
      text-align: center !important;
      padding-left: 0.5ch;
      padding-right: 0.5ch;
      border-right: 1px solid #e5e8f0 !important;
    }
    td.lock-col {
      text-align: center;
      vertical-align: middle;
      padding: 0;
    }
    .lock-schedule-cb {
      -webkit-appearance: none;
      appearance: none;
      background-color: transparent;
      border: 1px solid #1A2B6C;
      border-radius: 3px;
      width: 0.8em;
      height: 0.8em;
      cursor: pointer;
      position: absolute;
      left: 0.4ch;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      place-content: center;
      transition: opacity 0.2s, border-color 0.2s;
      opacity: 0.25;
    }
    .lock-schedule-cb:hover {
      opacity: 0.6;
    }
    .lock-schedule-cb::before {
      content: '🔒';
      font-size: 0.5em;
      opacity: 0;
      transition: opacity 0.1s;
      display: block;
      line-height: 1;
    }
    .lock-schedule-cb:checked {
      opacity: 1;
    }
    .lock-schedule-cb:checked::before {
      opacity: 1;
    }
    /* --- Custom Lock Checkbox Styles --- */
    td.interval-col, td.duration-col, td.handle-col, td.delete-col {
      position: relative !important;
    }
    td.interval-col {
      padding-left: 1.8ch !important;
    }
    .time-gap-row td {
      background-color: #e6ffed !important;
      color: #2b6b3e;
      font-style: italic;
      height: auto;
      padding-top: 0.3rem !important;
      padding-bottom: 0.3rem !important;
    }
    .time-gap-row td.delete-col {
      background-color: #F2F5FF !important;
    }
    .time-gap-row td:first-child::before {
      content: '↔';
      color: #2b6b3e;
      opacity: 0.8;
      font-size: 0.9em;
      margin-left: 0.5em;
    }
    .time-gap-row .task-col {
      text-align: left !important;
    }
    .schedule-overlap .interval-col {
      background-color: #fff0f0 !important;
      border-color: #e5e8f0 !important;
      box-shadow: none !important;
    }
    .placeholder {
      background: transparent;
    }
    .placeholder td {
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      height: 0px; /*
Make it visually empty but present */
    }
    .placeholder-content {
      height: 100%;
      background: rgba(0, 123, 255, 0.05);
      border-top: 1px dashed rgba(0, 123, 255, 0.5);
      border-bottom: 1px dashed rgba(0, 123, 255, 0.5);
      box-sizing: border-box;
    }
    .add-row-group {
      position: relative;
      display: inline-block;
    }
    .add-row-dropdown {
      display: none;
      position: absolute;
      left: 0;
      top: 110%;
      min-width: 110px;
      background: #fff;
      box-shadow: 0 4px 16px #0002;
      border-radius: 8px;
      border: 1px solid #e5e8f0;
      z-index: 10000;
      padding: 0.3em 0;
      overflow: visible;
    }
    .add-row-group.open .add-row-dropdown {
      display: block;
    }
    .add-row-dropdown button {
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      padding: 0.5em 1em;
      font-size: 0.8em;
      color: #1A2B6C;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.15s;
    }
    .add-row-dropdown button:hover {
      background: #f0f7ff;
      color: #1976d2;
    }
    .doc-btn {
      background: #1976d2 !important;
      color: #fff !important;
      font-size: 1.05rem !important;
      border-radius: 8px !important;
      padding: 0.32em 0.8em !important;
      box-shadow: 0 2px 8px #1a2b6c22 !important;
      text-transform: none !important;
      font-weight: 700 !important;
      letter-spacing: 0.04em !important;
      margin-left: 0 !important;
    }

    .add-table-btn {
      background: #26A040 !important;
      color: #fff !important;
      font-size: 1.05rem !important;
      border-radius: 8px !important;
      padding: 0.32em 0.8em !important;
      box-shadow: 0 2px 8px #1a2b6c22 !important;
      text-transform: none !important;
      font-weight: 700 !important;
      letter-spacing: 0.04em !important;
    }

    .add-table-btn:hover {
      background: #1E7E36 !important;
    }
    .doc-btn:hover {
      background: #2B5B97 !important;
      color: #fff !important;
    }
  </style>
</head>
<body>

  <div class="planner-container">
    <div id="header" contenteditable="true" data-placeholder="Day"></div>

    <div class="table-wrapper">
      <table>
        <colgroup>
          <col class="handle-col">
          <col class="task-col">
          <col class="interval-col">
          <col class="duration-col">
          <col class="delete-col">
        </colgroup>
        <thead>
          <tr>
            <th></th>
            <th>Task</th>
            <th class="interval-col">SCHEDULE</th>
            <th class="duration-col">DURATION</th>
            <th class="delete-col"></th>
          </tr>
        </thead>
        <tbody>
          <tr draggable="true">
            <td class="handle-col">≡</td>
            <td class="task-col" contenteditable="true"></td>
            <td class="interval-col">
              <input type="checkbox" class="lock-schedule-cb" title="Fix time">
              <input type="text" class="start-hh" maxlength="2" size="2" placeholder="hh">:<input type="text" class="start-mm" maxlength="2" size="2" placeholder="mm">
              – <span class="auto-end-time">--:--</span>
              <div class="custom-time-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;">
                <!-- picker content будет добавляться динамически -->
              </div>
            </td>
            <td class="duration-col"><input type="number" class="duration" min="0" step="10" placeholder="min"><div class="custom-duration-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;"></div></td>
            <td class="delete-col">
              <button class="row-delete-btn" title="Delete row">🗑️</button>
            </td>
          </tr>
          <tr draggable="true">
            <td class="handle-col">≡</td>
            <td class="task-col" contenteditable="true"></td>
            <td class="interval-col">
              <input type="checkbox" class="lock-schedule-cb" title="Fix time">
              <input type="text" class="start-hh" maxlength="2" size="2" placeholder="hh">:<input type="text" class="start-mm" maxlength="2" size="2" placeholder="mm">
              – <span class="auto-end-time">--:--</span>
              <div class="custom-time-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;">
                <!-- picker content будет добавляться динамически -->
              </div>
            </td>
            <td class="duration-col"><input type="number" class="duration" min="0" step="10" placeholder="min"><div class="custom-duration-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;"></div></td>
            <td class="delete-col">
              <button class="row-delete-btn" title="Delete row">🗑️</button>
            </td>
          </tr>
          <tr draggable="true">
            <td class="handle-col">≡</td>
            <td class="task-col" contenteditable="true"></td>
            <td class="interval-col">
              <input type="checkbox" class="lock-schedule-cb" title="Fix time">
              <input type="text" class="start-hh" maxlength="2" size="2" placeholder="hh">:<input type="text" class="start-mm" maxlength="2" size="2" placeholder="mm">
              – <span class="auto-end-time">--:--</span>
              <div class="custom-time-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;">
                <!-- picker content будет добавляться динамически -->
              </div>
            </td>
            <td class="duration-col"><input type="number" class="duration" min="0" step="10" placeholder="min"><div class="custom-duration-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;"></div></td>
            <td class="delete-col">
              <button class="row-delete-btn" title="Удалить строку">🗑️</button>
            </td>
          </tr>
          <tr draggable="true">
            <td class="handle-col">≡</td>
            <td class="task-col" contenteditable="true"></td>
            <td class="interval-col">
              <input type="checkbox" class="lock-schedule-cb" title="Fix time">
              <input type="text" class="start-hh" maxlength="2" size="2" placeholder="hh">:<input type="text" class="start-mm" maxlength="2" size="2" placeholder="mm">
              – <span class="auto-end-time">--:--</span>
              <div class="custom-time-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;">
                <!-- picker content будет добавляться динамически -->
              </div>
            </td>
            <td class="duration-col"><input type="number" class="duration" min="0" step="10" placeholder="min"><div class="custom-duration-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;"></div></td>
            <td class="delete-col">
              <button class="row-delete-btn" title="Удалить строку">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="table-buttons">
        <div class="add-row-group">
          <button class="add-row-btn" title="Add row">➕</button>
          <div class="add-row-dropdown">
            <button data-rows="2">+ 2 rows</button>
            <button data-rows="3">+ 3 rows</button>
            <button data-rows="4">+ 4 rows</button>
          </div>
        </div>
        <button class="add-table-btn" title="Add table">🗒️</button>
        <button class="export-ics-btn" title="Export to Calendar" style="background:#1976d2; color:#fff;">📅</button>
        <button class="doc-btn" title="Copy as text" style="background:#1976d2; color:#fff;">📄</button>
      </div>
    </div>
  </div>

  <script>
    // Helpers
    function toMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }
    function fmtTime(mins) {
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Automatically fill the Day header with date and day of week
      const header = document.getElementById('header');
      if (header && (!header.textContent || header.textContent.trim() === '')) {
        const d = new Date();
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const day = days[d.getDay()];
        header.textContent = `${dd}/${mm} ${day}`;
      }

      const container = document.querySelector('.planner-container');

      // Export to .ics
      function pad2(n) { return n.toString().padStart(2, '0'); }
      function toIcsDate(date, hh, mm) {
        // date: YYYY-MM-DD, hh: "12", mm: "35"
        return `${date.replace(/-/g, '')}T${hh.padStart(2, '0')}${mm.padStart(2, '0')}00`;
      }
      // Delegate click for export to .ics and copy table
      document.addEventListener('click', function(e) {
        // --- Export to .ics ---
        if (e.target.classList.contains('export-ics-btn')) {
          let ics = 'BEGIN:VCALENDAR\nVERSION:2.0\nCALSCALE:GREGORIAN\n';
          const wrapper = e.target.closest('.table-wrapper');
          let header = wrapper.previousElementSibling;
          let title = '';
          let dateStr = '';
          if (header && header.getAttribute && header.getAttribute('contenteditable')) {
            title = header.textContent.trim() || header.getAttribute('data-placeholder') || '';
            const match = title.match(/(\d{2})\/(\d{2})/);
            if (match) {
              const d = new Date();
              const yyyy = d.getFullYear();
              dateStr = `${yyyy}-${match[2]}-${match[1]}`;
            }
          }
          if (!dateStr) {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            dateStr = `${yyyy}-${mm}-${dd}`;
          }
          const icsDateStr = dateStr.replace(/-/g, '');
          wrapper.querySelectorAll('tbody tr').forEach((tr) => {
            if (tr.classList.contains('time-gap-row')) return;
            const desc  = tr.querySelector('td.task-col')?.textContent.trim();
            const sh = tr.querySelector('.start-hh')?.value;
            const sm = tr.querySelector('.start-mm')?.value;
            const dur = tr.querySelector('.duration')?.value;
            const autoEnd = tr.querySelector('.auto-end-time')?.textContent;
            if (desc && sh && sm && dur && autoEnd && autoEnd !== '--:--') {
              const [eh, em] = autoEnd.split(':');
              const dtStart = toIcsDate(icsDateStr, sh, sm);
              const dtEnd   = toIcsDate(icsDateStr, eh, em);
              ics += 'BEGIN:VEVENT\n';
              ics += `SUMMARY:${desc.replace(/\n/g, ' ')}\n`;
              if (title) ics += `DESCRIPTION:${title}\n`;
              ics += `DTSTART:${dtStart}\n`;
              ics += `DTEND:${dtEnd}\n`;
              ics += 'END:VEVENT\n';
            }
          });
          ics += 'END:VCALENDAR';
          const blob = new Blob([ics], { type: 'text/calendar' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'schedule.ics';
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 100);
        }
        // --- Use Clipboard API ---
        if (e.target.classList.contains('doc-btn')) {
          const wrapper = e.target.closest('.table-wrapper');
          const table = wrapper.querySelector('table');
          const header = wrapper.previousElementSibling;
          
          // Clone table for manipulations
          const tableClone = table.cloneNode(true);

          // --- Modify clone ---
          
          // 1. Remove colgroup's
          const colgroup = tableClone.querySelector('colgroup');
          if (colgroup) {
              if (colgroup.children[4]) colgroup.children[4].remove();
              if (colgroup.children[0]) colgroup.children[0].remove();
          }

          // 2. Modify all rows (including header)
          Array.from(tableClone.rows).forEach(tr => {
              // Remove last (delete) and first (handle) cells
              if (tr.cells[4]) tr.cells[4].remove();
              if (tr.cells[0]) tr.cells[0].remove();

              // If this is not a header row and not a time-gap
              if (tr.parentElement.tagName === 'TBODY' && !tr.classList.contains('time-gap-row')) {
                  const originalRow = table.rows[tr.rowIndex];
                  if (!originalRow) return;

                  // Replace inputs with text in SCHEDULE
                  const scheduleTd = tr.querySelector('td.interval-col');
                  if (scheduleTd) {
                      const sh = originalRow.querySelector('.start-hh')?.value.padStart(2, '0') || '--';
                      const sm = originalRow.querySelector('.start-mm')?.value.padStart(2, '0') || '--';
                      const autoEnd = originalRow.querySelector('.auto-end-time')?.textContent || '--:--';
                      scheduleTd.innerHTML = `${sh}:${sm} – ${autoEnd}`;
                  }

                  // Replace input with text in DURATION
                  const durationTd = tr.querySelector('td.duration-col');
                  if (durationTd) {
                      durationTd.innerHTML = originalRow.querySelector('.duration')?.value || '';
                  }
              }
          });

          // --- Prepare data for clipboard ---
          const tempDiv = document.createElement('div');
          if (header && header.textContent) {
              const h = document.createElement('div');
              h.textContent = header.textContent;
              h.style.fontWeight = 'bold';
              h.style.marginBottom = '0.5em';
              tempDiv.appendChild(h);
          }
          tempDiv.appendChild(tableClone);

          // --- Use Clipboard API ---
          const htmlBlob = new Blob([tempDiv.innerHTML], { type: 'text/html' });
          const textBlob = new Blob([tempDiv.innerText], { type: 'text/plain' });

          navigator.clipboard.write([
              new ClipboardItem({
                  'text/html': htmlBlob,
                  'text/plain': textBlob
              })
          ]).then(() => {
              const originalText = e.target.textContent;
              const originalBg = e.target.style.background;
              e.target.textContent = '✅';
              e.target.style.background = '#28a745';
              setTimeout(() => {
                  e.target.textContent = originalText;
                  e.target.style.background = originalBg;
              }, 1500);
          }).catch(err => {
              console.error('Failed to copy to clipboard:', err);
              alert('Failed to copy. Please check browser permissions.');
          });
        }
        // Close time-picker when clicking outside picker
        if (!e.target.closest('.custom-time-picker') && !e.target.classList.contains('start-hh') && !e.target.classList.contains('start-mm')) {
          document.querySelectorAll('.custom-time-picker').forEach(p => p.style.display = 'none');
        }
      });

      // Delegate clicks: add-row, add-table, auto-fill
      container.addEventListener('click', e => {
        if (e.target.matches('.add-table-btn')) {
          let origTable = e.target.closest('.table-wrapper');
          let origHeader = origTable.previousElementSibling;
          if (!origHeader || !origHeader.hasAttribute('contenteditable')) {
            origHeader = container.querySelector('#header, .header');
          }
          const cloneHeader = origHeader.cloneNode(true);
          // Set header to +1 day ahead of previous
          let prevDate = null;
          // Try to get date from previous header
          const prevText = origHeader.textContent.trim();
          const dateMatch = prevText.match(/(\d{2})\/(\d{2})/);
          if (dateMatch) {
            const prev = new Date();
            prev.setDate(1); // reset to first day of month
            prev.setMonth(parseInt(dateMatch[2], 10) - 1);
            prev.setDate(parseInt(dateMatch[1], 10));
            prev.setDate(prev.getDate() + 1);
            const dd = String(prev.getDate()).padStart(2, '0');
            const mm = String(prev.getMonth() + 1).padStart(2, '0');
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const day = days[prev.getDay()];
            cloneHeader.textContent = `${dd}/${mm} ${day}`;
          } else {
            // If failed — set to tomorrow
            const d = new Date();
            d.setDate(d.getDate() + 1);
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
            const day = days[d.getDay()];
            cloneHeader.textContent = `${dd}/${mm} ${day}`;
          }
          const cloneTable = origTable.cloneNode(true);
          // Clear new table content
          // 1. Remove all time-gap-row rows
          cloneTable.querySelectorAll('tr.time-gap-row').forEach(row => row.remove());
          // 2. Reset all input and checkbox values
          cloneTable.querySelectorAll('input').forEach(i => {
            if (i.type === 'checkbox') i.checked = false;
            else i.value = '';
          });
          // 3. Clear .auto-end-time
          cloneTable.querySelectorAll('.auto-end-time').forEach(span => span.textContent = '--:--');
          // 4. Clear task-col
          cloneTable.querySelectorAll('td.task-col').forEach(td => td.textContent = '');
          // 5. Remove red highlight schedule-overlap
          cloneTable.querySelectorAll('tr.schedule-overlap').forEach(tr => tr.classList.remove('schedule-overlap'));
          // Add remove button only to new tables
          const btns = cloneTable.querySelector('.table-buttons');
          if (btns && !btns.querySelector('.remove-table-btn')) {
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-table-btn';
            removeBtn.title = 'Удалить таблицу';
            removeBtn.style.background = '#c00';
            removeBtn.textContent = '🗒️';
            btns.insertBefore(removeBtn, btns.querySelector('.export-ics-btn'));
          }
          container.appendChild(cloneHeader);
          container.appendChild(cloneTable);
          initTable(cloneTable.querySelector('table'));
          enableRowDeleteDelegation();
          initDragAndDrop();
          initAddRowDropdowns();
        }
        if (e.target.matches('.add-row-btn')) {
          const table = e.target.closest('.table-wrapper').querySelector('table');
          addRow(table);
          enableRowDeleteDelegation();
          initDragAndDrop();
        }
        if (e.target.matches('.add-row-dropdown button')) {
          const n = parseInt(e.target.getAttribute('data-rows'), 10);
          const table = e.target.closest('.table-wrapper').querySelector('table');
          for (let i = 0; i < n; ++i) addRow(table);
          enableRowDeleteDelegation();
          initDragAndDrop();
        }
        if (e.target.matches('.remove-table-btn')) {
          const tableWrapper = e.target.closest('.table-wrapper');
          // Remove header before table if present
          const header = tableWrapper.previousElementSibling;
          if (header && header.getAttribute && header.getAttribute('contenteditable')) {
            header.remove();
          }
          tableWrapper.remove();
        }
      });

      // Initialize tables
      document.querySelectorAll('.table-wrapper table').forEach(initTable);
      enableRowDeleteDelegation();
      initDragAndDrop();

      function initTable(table) {
        addRow(table, true);
        table.querySelectorAll('tbody tr').forEach(tr => attachRow(tr));
      }

      function addRow(table, copyFirst = false) {
        const tbody = table.tBodies[0];
        const proto = tbody.rows[0];
        const tr = proto.cloneNode(true);
        // Clear content but not structure
        tr.querySelectorAll('td.task-col').forEach(td => td.textContent = '');
        tr.querySelectorAll('input').forEach(i => i.value = '');
        tr.setAttribute('draggable','true');
        // Reset handle-col to "≡"
        const handle = tr.querySelector('td.handle-col');
        if (handle) handle.textContent = '≡';
        // Ensure custom-duration-picker exists
        const durTd = tr.querySelector('td.duration-col');
        if (durTd && !durTd.querySelector('.custom-duration-picker')) {
          const picker = document.createElement('div');
          picker.className = 'custom-duration-picker';
          picker.style.display = 'none';
          picker.style.position = 'fixed';
          picker.style.left = '0';
          picker.style.top = '0';
          picker.style.zIndex = '10000';
          picker.style.background = '#fff';
          picker.style.border = '1px solid #ccc';
          picker.style.borderRadius = '8px';
          picker.style.boxShadow = '0 2px 8px #0002';
          picker.style.padding = '0.5rem';
          durTd.appendChild(picker);
        }
        // Check that td count matches reference (thead)
        let refCount = 0;
        const tableHead = table.tHead && table.tHead.rows.length > 0 ? table.tHead.rows[0] : null;
        if (tableHead) {
          refCount = Array.from(tableHead.cells).reduce((sum, th) => sum + (parseInt(th.colSpan) || 1), 0);
        } else {
          refCount = proto.children.length;
        }
        // Align td count
        let curCount = Array.from(tr.children).reduce((sum, td) => sum + (parseInt(td.colSpan) || 1), 0);
        while (curCount < refCount) {
          tr.appendChild(document.createElement('td'));
          curCount++;
        }
        while (curCount > refCount) {
          tr.removeChild(tr.lastChild);
          curCount--;
        }
        attachRow(tr);
        tbody.appendChild(tr);
        if (copyFirst) tbody.removeChild(proto);
      }

      // --- Flag to suppress autofill when programmatically setting value ---
      let suppressAutoFill = false;

      function attachRow(tr) {
        const startHH = tr.querySelector('.start-hh');
        const startMM = tr.querySelector('.start-mm');
        const dur     = tr.querySelector('.duration');
        const autoEnd = tr.querySelector('.auto-end-time');
        const lockCb  = tr.querySelector('.lock-schedule-cb');
        const taskTd  = tr.querySelector('td.task-col');

        if (taskTd) {
          taskTd.addEventListener('keydown', function(e) {
            if ((e.key === 'Enter' || e.keyCode === 13) && !e.shiftKey) {
              if (e.ctrlKey || e.metaKey) {
                // Ctrl+Enter or Cmd+Enter — line break
                document.execCommand('insertLineBreak');
                e.preventDefault();
              } else {
                // Just Enter — move to cell below
                e.preventDefault();
                let nextTr = tr.nextElementSibling;
                while (nextTr && (nextTr.classList.contains('time-gap-row') || !nextTr.querySelector('td.task-col'))) {
                  nextTr = nextTr.nextElementSibling;
                }
                if (nextTr) {
                  const nextTask = nextTr.querySelector('td.task-col');
                  if (nextTask) {
                    nextTask.focus();
                    // Move cursor to start (or end) of cell
                    const sel = window.getSelection();
                    sel.selectAllChildren(nextTask);
                    sel.collapseToEnd();
                  }
                }
              }
            }
          });
        }

        if(lockCb) {
          lockCb.addEventListener('change', function() {
            const table = this.closest('table');
            if (table) autoFillSchedule(table);
          });
        }
        // Auto-switch between time fields (only for schedule)
        startHH.addEventListener('input', function() {
          if (this.value.length === 2) {
            const mmInput = tr.querySelector('.start-mm');
            // Move to minutes only if focus is not on them
            if (mmInput && document.activeElement !== mmInput) {
              // Close hour picker
              const td = this.closest('.interval-col');
              const picker = td && td.querySelector('.custom-time-picker');
              if (picker) picker.style.display = 'none';
              // Focus and open minute picker
              setTimeout(() => {
                mmInput.focus();
                mmInput.select();
                mmInput.dispatchEvent(new MouseEvent('click', {bubbles:true}));
              }, 0);
            }
          }
        });
        startMM.addEventListener('input', function() {
          if (this.value.length === 2) {
            // Remove focus and close picker
            this.blur();
            const td = this.closest('.interval-col');
            if (td) {
              const picker = td.querySelector('.custom-time-picker');
              if (picker) picker.style.display = 'none';
            }
            // Only after entering minutes, trigger autofill
            const tr = this.closest('tr');
            if (tr) {
              const table = tr.closest('table');
              autoFillSchedule(table, tr);
            }
          }
        });
        [startHH, startMM].forEach(inp => {
          inp.addEventListener('focus', function() {
            setTimeout(() => inp.select(), 0);
          });
        });
        // duration: select on focus
        dur.addEventListener('focus', function() {
          setTimeout(() => dur.select(), 0);
        });
        // --- ADDED: handle Enter and range 25-249 ---
        dur.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.keyCode === 13) {
            e.preventDefault();
            dur.blur();
            // Close picker if present
            const td = dur.closest('.duration-col');
            const picker = td && td.querySelector('.custom-duration-picker');
            if (picker) picker.style.display = 'none';
            // Move focus to duration in next row
            let nextTr = tr.nextElementSibling;
            while (nextTr && (nextTr.classList.contains('time-gap-row') || !nextTr.querySelector('.duration'))) {
              nextTr = nextTr.nextElementSibling;
            }
            if (nextTr) {
              const nextDur = nextTr.querySelector('.duration');
              if (nextDur) {
                nextDur.focus();
                nextDur.select();
              }
            }
          }
        });
        dur.addEventListener('input', function(e) {
          const val = parseInt(dur.value, 10);
          if (!isNaN(val) && val >= 25 && val <= 249) {
            dur.blur();
            // Close picker if present
            const td = dur.closest('.duration-col');
            const picker = td && td.querySelector('.custom-duration-picker');
            if (picker) picker.style.display = 'none';
            // Move focus to duration in next row
            let nextTr = tr.nextElementSibling;
            while (nextTr && (nextTr.classList.contains('time-gap-row') || !nextTr.querySelector('.duration'))) {
              nextTr = nextTr.nextElementSibling;
            }
            if (nextTr) {
              const nextDur = nextTr.querySelector('.duration');
              if (nextDur) {
                nextDur.focus();
                nextDur.select();
              }
            }
          }
        });
        // Autofill on blur if both fields are filled
        function tryAutoFillOnBlur() {
          const tr = this.closest('tr');
          if (!tr) return;
          const startHH = tr.querySelector('.start-hh');
          const startMM = tr.querySelector('.start-mm');
          if (startHH.value.length === 2 && startMM.value.length === 2) {
            // Trigger autofill by reassigning minutes
            startMM.value = startMM.value;
            const table = tr.closest('table');
            autoFillSchedule(table, tr);
          }
        }
        startHH.addEventListener('blur', tryAutoFillOnBlur);
        startMM.addEventListener('blur', tryAutoFillOnBlur);
        // Autofill schedule on time or duration change
        function triggerAutoFill() {
          // If picker is open — don't autofill
          const td = this.closest && this.closest('.interval-col');
          if (td) {
            const picker = td.querySelector('.custom-time-picker');
            if (picker && picker.style.display === 'flex') return;
          }
          // Call autofill only if this field is minutes or duration
          if (this.classList.contains('start-mm') || this.classList.contains('duration')) {
            const table = tr.closest('table');
            autoFillSchedule(table, tr);
            }
        }
        // Save handler reference for possible removal
        startHH._changeHandler = triggerAutoFill;
        startMM._changeHandler = triggerAutoFill;
        [startHH, startMM].forEach(inp => inp.addEventListener('change', triggerAutoFill));
        dur.addEventListener('change', triggerAutoFill);
      }

      function createGapRow(table, startTime, endTime) {
        const colgroup = table.querySelector('colgroup');
        const tr = document.createElement('tr');
        tr.className = 'time-gap-row';
        tr.setAttribute('draggable', 'false');

        const gapDuration = endTime - startTime;
        const cells = {
            handle: '<td class="handle-col"></td>',
            task: `<td class="task-col">Time Gap</td>`,
            schedule: `<td class="interval-col">${fmtTime(startTime)} - ${fmtTime(endTime)}</td>`,
            duration: `<td class="duration-col">${gapDuration} min</td>`,
            delete: '<td class="delete-col"></td>'
        };

        let innerHTML = '';
        if (colgroup) {
            for (const col of colgroup.children) {
                if (col.classList.contains('handle-col')) innerHTML += cells.handle;
                else if (col.classList.contains('task-col')) innerHTML += cells.task;
                else if (col.classList.contains('interval-col')) innerHTML += cells.schedule;
                else if (col.classList.contains('duration-col')) innerHTML += cells.duration;
                else if (col.classList.contains('delete-col')) innerHTML += cells.delete;
                else innerHTML += '<td></td>';
            }
        }
        tr.innerHTML = innerHTML;
        return tr;
      }

      // Automatically fill the Day header with date and day of week
      function autoFillSchedule(table) {
        // 1. Cleanup phase
        const rows = Array.from(table.tBodies[0].rows);
        rows.forEach(row => {
            row.classList.remove('schedule-overlap');
            if (row.classList.contains('time-gap-row')) {
                row.remove();
            }
        });

        const getMinutes = (hh, mm) => {
          if (!hh || !mm || hh.length < 1 || mm.length < 1) return null;
          return parseInt(hh, 10) * 60 + parseInt(mm, 10);
        };

        // 2. Recalculation phase
        const cleanRows = Array.from(table.tBodies[0].rows);
        let timeFromPrev = null;
        let prevRow = null;

        for (const row of cleanRows) {
            const startHH = row.querySelector('.start-hh');
            const startMM = row.querySelector('.start-mm');
            const durInput = row.querySelector('.duration');
            const autoEnd = row.querySelector('.auto-end-time');
            const isLocked = row.querySelector('.lock-schedule-cb')?.checked;

            let rowStartTime = getMinutes(startHH.value, startMM.value);

            if (timeFromPrev !== null && rowStartTime !== null && isLocked) {
                const gap = rowStartTime - timeFromPrev;
                if (gap > 0) {
                    const gapRow = createGapRow(table, timeFromPrev, rowStartTime);
                    row.before(gapRow);
                } else if (gap < 0) {
                    row.classList.add('schedule-overlap');
                    if (prevRow) prevRow.classList.add('schedule-overlap');
                }
            }

            let effectiveStartTime;
            if (isLocked) {
                effectiveStartTime = rowStartTime;
            } else {
                if (timeFromPrev !== null) {
                    effectiveStartTime = timeFromPrev;
                    startHH.value = String(Math.floor(effectiveStartTime / 60)).padStart(2, '0');
                    startMM.value = String(effectiveStartTime % 60).padStart(2, '0');
                } else {
                    effectiveStartTime = rowStartTime;
                }
            }

            if (effectiveStartTime !== null) {
                const d = parseInt(durInput.value, 10);
                if (!isNaN(d) && d >= 0) {
                    const endTime = effectiveStartTime + d;
                    if (endTime > 1440) {
                        autoEnd.textContent = '--:--';
                        timeFromPrev = null;
                    } else {
                        autoEnd.textContent = fmtTime(endTime);
                        timeFromPrev = endTime;
                    }
                } else {
                    autoEnd.textContent = '--:--';
                    timeFromPrev = null;
                }
            } else {
                autoEnd.textContent = '--:--';
                timeFromPrev = null;
            }
            if (!row.classList.contains('time-gap-row')) {
                prevRow = row;
          }
        }
      }

      function autoFill(table) {
        const rows = Array.from(table.tBodies[0].rows);
        if (!rows.length) return;
        const first = rows[0];
        const sh = first.querySelector('.start-hh').value;
        const sm = first.querySelector('.start-mm').value;
        if (!sh || !sm) {
          first.querySelector('.start-hh').classList.add('invalid');
          first.querySelector('.start-mm').classList.add('invalid');
          // Remove highlight if user starts typing
          first.querySelector('.start-hh').addEventListener('input', function clearInvalid() {
            this.classList.remove('invalid');
            first.querySelector('.start-mm').classList.remove('invalid');
            this.removeEventListener('input', clearInvalid);
          });
          first.querySelector('.start-mm').addEventListener('input', function clearInvalid() {
            this.classList.remove('invalid');
            first.querySelector('.start-hh').classList.remove('invalid');
            this.removeEventListener('input', clearInvalid);
          });
          return;
        }
        let cur = parseInt(sh, 10) * 60 + parseInt(sm, 10);
        rows.forEach(tr => {
          const d = parseInt(tr.querySelector('.duration').value,10);
          if (isNaN(d)) {
            tr.querySelector('.duration').classList.add('invalid');
            return;
          }
          const s = fmtTime(cur), e = fmtTime(cur + d);
          tr.querySelector('.start-hh').value = s.split(':')[0];
          tr.querySelector('.start-mm').value = s.split(':')[1];
          tr.querySelector('.end-hh').value   = e.split(':')[0];
          tr.querySelector('.end-mm').value   = e.split(':')[1];
          tr.querySelectorAll('.start-hh, .start-mm, .end-hh, .end-mm').forEach(i => i.classList.remove('invalid'));
          cur += d;
        });
      }

      // --- Custom time-picker and duration-picker ---
      document.addEventListener('click', function(e) {
        // Open custom time-picker on start-hh click
        if (e.target.classList.contains('start-hh')) {
          const td = e.target.closest('.interval-col');
          const tr = td.closest('tr');
          const picker = td.querySelector('.custom-time-picker');
          document.querySelectorAll('.custom-time-picker').forEach(p => { if (p !== picker) p.style.display = 'none'; });
          if (picker.style.display === 'flex') { picker.style.display = 'none'; return; }
          // Generate hour values (three times)
          let hours = [];
          for (let rep = 0; rep < 3; ++rep) for (let i = 0; i < 24; ++i) hours.push(i.toString().padStart(2, '0'));
          // Determine what to highlight
          let curHH = td.querySelector('.start-hh').value.trim();
          if (!curHH) {
            // If input is empty — find nearest value above/below or 12
            let defHH = '12';
            let found = false;
            let prevTr = tr.previousElementSibling;
            while (prevTr) {
              const val = prevTr.querySelector('.start-hh')?.value;
              if (val && val !== '') { defHH = val.padStart(2, '0'); found = true; break; }
              prevTr = prevTr.previousElementSibling;
            }
            if (!found) {
              let nextTr = tr.nextElementSibling;
              while (nextTr) {
                const val = nextTr.querySelector('.start-hh')?.value;
                if (val && val !== '') { defHH = val.padStart(2, '0'); break; }
                nextTr = nextTr.nextElementSibling;
              }
            }
            curHH = defHH;
          } else {
            curHH = curHH.padStart(2, '0');
          }
          picker.innerHTML =
            `<div class='picker-col' data-type='start-hh'>` +
            hours.map(h => `<div class='picker-item${h==curHH?" selected":""}' data-val='${h}'>${h}</div>`).join('') +
            `</div>`;
          picker.style.display = 'flex';
          const inputRect = e.target.getBoundingClientRect();
          picker.style.left = inputRect.left + 'px';
          picker.style.top = (inputRect.bottom + 4) + 'px';
          // Scroll to middle value (from second block)
          setTimeout(() => {
            const col = picker.querySelector('.picker-col');
            const items = Array.from(col.querySelectorAll('.picker-item'));
            const allIdx = items.map((item, idx) => item.getAttribute('data-val') === curHH ? idx : -1).filter(idx => idx !== -1);
            let centerIdx = allIdx[0];
            if (allIdx.length > 1) centerIdx = allIdx[Math.floor(allIdx.length/2)];
            const item = items[centerIdx];
            if (item) {
              const itemHeight = item.clientHeight;
              col.scrollTop = item.offsetTop - col.clientHeight/2 + itemHeight/2;
            }
          }, 0);
        }
        // Open custom time-picker on start-mm click
        if (e.target.classList.contains('start-mm')) {
          const td = e.target.closest('.interval-col');
          const picker = td.querySelector('.custom-time-picker');
          document.querySelectorAll('.custom-time-picker').forEach(p => { if (p !== picker) p.style.display = 'none'; });
          if (picker.style.display === 'flex') { picker.style.display = 'none'; return; }
          // Generate minute values (three times)
          let minutes = [];
          for (let rep = 0; rep < 3; ++rep) for (let i = 0; i < 60; i += 5) minutes.push(i.toString().padStart(2, '0'));
          const curMM = td.querySelector('.start-mm').value.padStart(2, '0');
          picker.innerHTML =
            `<div class='picker-col' data-type='start-mm'>` +
            minutes.map(m => `<div class='picker-item${m==curMM?" selected":""}' data-val='${m}'>${m}</div>`).join('') +
            `</div>`;
          picker.style.display = 'flex';
          const inputRect = e.target.getBoundingClientRect();
          picker.style.left = inputRect.left + 'px';
          picker.style.top = (inputRect.bottom + 4) + 'px';
          // Scroll to middle value (from second block)
          setTimeout(() => {
            const col = picker.querySelector('.picker-col');
            const items = Array.from(col.querySelectorAll('.picker-item'));
            const allIdx = items.map((item, idx) => item.getAttribute('data-val') === curMM ? idx : -1).filter(idx => idx !== -1);
            let centerIdx = allIdx[0];
            if (allIdx.length > 1) centerIdx = allIdx[Math.floor(allIdx.length/2)];
            const item = items[centerIdx];
            if (item) {
              const itemHeight = item.clientHeight;
              col.scrollTop = item.offsetTop - col.clientHeight/2 + itemHeight/2;
            }
          }, 0);
        }
        if (e.target.classList.contains('picker-item')) {
          const col = e.target.closest('.picker-col');
          const type = col.getAttribute('data-type');
          const td = e.target.closest('.interval-col');
          const input = td.querySelector('.' + type);
          input.value = e.target.getAttribute('data-val');
          col.querySelectorAll('.picker-item').forEach(i => i.classList.remove('selected'));
          e.target.classList.add('selected');
          input.focus();
          input.select();
          // If hours selected — close picker and simulate click on minutes
          if (type === 'start-hh') {
            const picker = td.querySelector('.custom-time-picker');
            if (picker) picker.style.display = 'none';
            const mmInput = td.querySelector('.start-mm');
            if (mmInput) {
              setTimeout(() => {
                mmInput.focus();
                mmInput.select();
                mmInput.dispatchEvent(new MouseEvent('click', {bubbles:true}));
              }, 0);
            }
            return;
          }
          // After selecting minutes — autofill schedule, blur and close picker
          if (type === 'start-mm') {
            const tr = td.closest('tr');
            if (tr) {
              const table = tr.closest('table');
              autoFillSchedule(table, tr);
            }
            input.blur();
            const picker = td.querySelector('.custom-time-picker');
            if (picker) picker.style.display = 'none';
          }
        }
        // Open custom duration-picker on duration click
        if (e.target.classList.contains('duration')) {
          const td = e.target.closest('.duration-col');
          const picker = td.querySelector('.custom-duration-picker');
          document.querySelectorAll('.custom-duration-picker').forEach(p => { if (p !== picker) p.style.display = 'none'; });
          if (picker.style.display === 'flex') { picker.style.display = 'none'; return; }
          let values = [];
          for (let i = 5; i <= 240; i += 5) values.push(i);
          let cur = parseInt(e.target.value, 10);
          if (isNaN(cur)) cur = 30;
          picker.innerHTML = values.map(v => `<div class='duration-picker-item${v==cur?" selected":""}' data-val='${v}'>${v}</div>`).join('');
          picker.style.display = 'flex';
          const inputRect = e.target.getBoundingClientRect();
          picker.style.left = inputRect.left + 'px';
          picker.style.top = (inputRect.bottom + 4) + 'px';
          // Autoscroll to selected value
          setTimeout(() => {
            const sel = picker.querySelector('.duration-picker-item.selected');
            if (sel) {
              picker.scrollTop = sel.offsetTop - picker.clientHeight/2 + sel.clientHeight/2;
            }
          }, 0);
        } else if (!e.target.closest('.custom-duration-picker')) {
          document.querySelectorAll('.custom-duration-picker').forEach(p => p.style.display = 'none');
        }
        // Click on duration-picker-item
        if (e.target.classList.contains('duration-picker-item')) {
          const td = e.target.closest('.duration-col');
          const input = td.querySelector('.duration');
          input.value = e.target.getAttribute('data-val');
          td.querySelectorAll('.duration-picker-item').forEach(i => i.classList.remove('selected'));
          e.target.classList.add('selected');
          input.focus();
          input.select();
          // Close picker after selection
          const picker = td.querySelector('.custom-duration-picker');
          if (picker) picker.style.display = 'none';
          // Recalculate schedule
          const tr = td.closest('tr');
          if (tr) {
            const table = tr.closest('table');
            autoFillSchedule(table, tr);
          }
        }
      });

      // In JS: add function for row delete event delegation
      function enableRowDeleteDelegation() {
        document.querySelectorAll('.table-wrapper table tbody').forEach(tbody => {
          if (!tbody._rowDeleteDelegation) {
            tbody.addEventListener('click', function(e) {
              if (e.target.classList.contains('row-delete-btn')) {
                const row = e.target.closest('tr');
                if (tbody.rows.length > 1) tbody.removeChild(row);
              }
            });
            tbody._rowDeleteDelegation = true;
          }
        });
      }

      // --- Global drag&drop for table rows ---
      function initDragAndDrop() {
        if (window.dragAndDropInitialized) return;
        window.dragAndDropInitialized = true;
        
        let globalDragged = null;
        let globalPlaceholder = null;

        document.addEventListener('dragstart', (e) => {
            const tr = e.target.closest('tbody tr');
            if (!tr || !tr.hasAttribute('draggable') || tr.getAttribute('draggable') === 'false') return;

            e.dataTransfer.effectAllowed = 'move';
            
            globalDragged = tr;
            
            const draggedHeight = globalDragged.getBoundingClientRect().height;
            const colspan = getColspanForTable(globalDragged.closest('table'));

            globalPlaceholder = document.createElement('tr');
            globalPlaceholder.classList.add('placeholder');
            globalPlaceholder.innerHTML = `<td colspan="${colspan}"><div class="placeholder-content" style="height: ${draggedHeight}px;"></div></td>`;
            
            setTimeout(() => {
                if(globalDragged) globalDragged.style.opacity = '0.5';
            }, 0);
        });

        document.addEventListener('dragend', (e) => {
            if (globalDragged) {
                globalDragged.style.opacity = '';
            }
            if (globalPlaceholder) {
                globalPlaceholder.remove();
            }
            globalDragged = null;
            globalPlaceholder = null;
        });

        document.addEventListener('dragover', e => {
            e.preventDefault();
            
            if (!globalDragged) return;
            e.dataTransfer.dropEffect = 'move';

            const tbody = e.target.closest('.table-wrapper table tbody');
            if (!tbody) return;

            let target = e.target.closest('tr');

            if (target && target.classList.contains('time-gap-row')) {
                tbody.insertBefore(globalPlaceholder, target);
                return;
            }
            
            if (target === globalDragged || target === globalPlaceholder) return;

            if (target) {
                const rect = target.getBoundingClientRect();
                const isAfter = e.clientY > rect.top + rect.height / 2;
                tbody.insertBefore(globalPlaceholder, isAfter ? target.nextSibling : target);
            } else {
                const rect = tbody.getBoundingClientRect();
                if (e.clientY < rect.top + rect.height / 2) {
                    if (tbody.firstChild !== globalPlaceholder) tbody.insertBefore(globalPlaceholder, tbody.firstChild);
                } else {
                    if (tbody.lastChild !== globalPlaceholder) tbody.appendChild(globalPlaceholder);
                }
            }
        });

        document.addEventListener('drop', e => {
            e.preventDefault();
            if (!globalDragged || !globalPlaceholder || !globalPlaceholder.parentElement) return;

            const tbody = globalPlaceholder.parentElement;
            const table = tbody.closest('table');
            
            const wasDraggingFirstRow = globalDragged.parentElement === tbody && globalDragged.previousElementSibling === null;
            const originalDraggedTime = {
                hh: globalDragged.querySelector('.start-hh').value,
                mm: globalDragged.querySelector('.start-mm').value
            };
            const isDroppingAtTop = globalPlaceholder.previousElementSibling === null;
            const originalFirstRow = Array.from(tbody.children).find(row => row !== globalDragged && !row.classList.contains('placeholder'));
            
            globalPlaceholder.parentElement.insertBefore(globalDragged, globalPlaceholder);
            
            const newFirstRow = tbody.querySelector('tr:not(.placeholder)');

            if (isDroppingAtTop && newFirstRow === globalDragged && originalFirstRow) {
                const draggedIsLocked = globalDragged.querySelector('.lock-schedule-cb')?.checked;
                const originalFirstIsLocked = originalFirstRow.querySelector('.lock-schedule-cb')?.checked;
                if (!draggedIsLocked && !originalFirstIsLocked) {
                    globalDragged.querySelector('.start-hh').value = originalFirstRow.querySelector('.start-hh').value;
                    globalDragged.querySelector('.start-mm').value = originalFirstRow.querySelector('.start-mm').value;
                }
            } else if (wasDraggingFirstRow && newFirstRow !== globalDragged) {
                const newFirstIsLocked = newFirstRow.querySelector('.lock-schedule-cb')?.checked;
                if (!newFirstIsLocked) {
                    newFirstRow.querySelector('.start-hh').value = originalDraggedTime.hh;
                    newFirstRow.querySelector('.start-mm').value = originalDraggedTime.mm;
                }
            }
            
            if (globalPlaceholder) globalPlaceholder.remove();
            if (table) autoFillSchedule(table);
        });
      }

      function getColspanForTable(table) {
        // Take max colspan among all th and td in table
        let maxColspan = 0;
        if (table.tHead && table.tHead.rows.length > 0) {
          const thSum = Array.from(table.tHead.rows[0].cells).reduce((sum, th) => sum + (parseInt(th.colSpan) || 1), 0);
          maxColspan = Math.max(maxColspan, thSum);
        }
        if (table.tBodies[0]) {
          Array.from(table.tBodies[0].rows).forEach(row => {
            const tdSum = Array.from(row.children).reduce((sum, td) => sum + (parseInt(td.colSpan) || 1), 0);
            maxColspan = Math.max(maxColspan, tdSum);
          });
        }
        return maxColspan || 4;
      }

      // Add functions for triple duplication of values
      function getHourFullRow(selected) {
        const arr = [];
        for (let rep = 0; rep < 3; ++rep) {
          for (let i = 0; i < 24; ++i) arr.push(i.toString().padStart(2, '0'));
        }
        return arr;
      }
      function getMinuteFullRow(selected) {
        const arr = [];
        for (let rep = 0; rep < 3; ++rep) {
          for (let i = 0; i < 60; i += 5) arr.push(i.toString().padStart(2, '0'));
        }
        return arr;
      }

      // --- Show/hide dropdown menu for adding rows ---
      function initAddRowDropdowns() {
        document.querySelectorAll('.add-row-group').forEach(group => {
          const btn = group.querySelector('.add-row-btn');
          const dropdown = group.querySelector('.add-row-dropdown');
          let hideTimeout = null;
          function openMenu() {
            clearTimeout(hideTimeout);
            group.classList.add('open');
          }
          function closeMenu() {
            hideTimeout = setTimeout(() => group.classList.remove('open'), 120);
          }
          btn.addEventListener('mouseenter', openMenu);
          btn.addEventListener('focus', openMenu);
          btn.addEventListener('mouseleave', closeMenu);
          btn.addEventListener('blur', closeMenu);
          dropdown.addEventListener('mouseenter', openMenu);
          dropdown.addEventListener('mouseleave', closeMenu);
        });
      }
      // Initialize on load
      initAddRowDropdowns();

      // --- ICS IMPORT (Drag & Drop) ---
      (function() {
        // Create overlay for drag feedback
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = 0;
        overlay.style.left = 0;
        overlay.style.right = 0;
        overlay.style.bottom = 0;
        overlay.style.background = 'rgba(41, 98, 255, 0.10)';
        overlay.style.zIndex = 99999;
        overlay.style.display = 'none';
        overlay.style.pointerEvents = 'none';
        overlay.style.transition = 'background 0.2s';
        overlay.innerHTML = '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;color:#1976d2;font-family:inherit;text-align:center;">Drop your .ics file here</div>';
        document.body.appendChild(overlay);

        let dragCounter = 0;
        window.addEventListener('dragenter', e => {
          dragCounter++;
          overlay.style.display = 'block';
        });
        window.addEventListener('dragleave', e => {
          dragCounter--;
          if (dragCounter <= 0) {
            overlay.style.display = 'none';
            dragCounter = 0;
          }
        });
        window.addEventListener('dragover', e => {
          e.preventDefault();
        });
        window.addEventListener('drop', e => {
          e.preventDefault();
          overlay.style.display = 'none';
          dragCounter = 0;
          if (!e.dataTransfer.files || !e.dataTransfer.files.length) return;
          for (const file of e.dataTransfer.files) {
            if (!file.name.endsWith('.ics')) {
              showIcsError('Only .ics files exported from this planner are supported.');
              continue;
            }
            const reader = new FileReader();
            reader.onload = function(ev) {
              try {
                importIcs(ev.target.result);
              } catch (err) {
                showIcsError('Failed to import. Only .ics files exported from this planner are supported.');
              }
            };
            reader.readAsText(file);
          }
        });

        function showIcsError(msg) {
          const err = document.createElement('div');
          err.textContent = msg;
          err.style.position = 'fixed';
          err.style.top = '2rem';
          err.style.left = '50%';
          err.style.transform = 'translateX(-50%)';
          err.style.background = '#c00';
          err.style.color = '#fff';
          err.style.padding = '1em 2em';
          err.style.borderRadius = '10px';
          err.style.fontWeight = 'bold';
          err.style.zIndex = 100000;
          document.body.appendChild(err);
          setTimeout(() => err.remove(), 3500);
        }

        function importIcs(text) {
          // Parse ICS
          const events = [];
          let cur = null;
          let calendarTitle = '';
          let calendarDate = '';
          let lines = text.split(/\r?\n/);
          for (let i = 0; i < lines.length; ++i) {
            let line = lines[i].trim();
            if (line === 'BEGIN:VEVENT') {
              cur = {};
            } else if (line === 'END:VEVENT') {
              if (cur) events.push(cur);
              cur = null;
            } else if (cur) {
              let idx = line.indexOf(':');
              if (idx > 0) {
                let key = line.slice(0, idx);
                let val = line.slice(idx + 1);
                cur[key] = val;
              }
            } else if (line.startsWith('DESCRIPTION:')) {
              calendarTitle = line.slice('DESCRIPTION:'.length);
            }
          }
          if (!events.length) throw new Error('No events');
          // Group by DTSTART date
          const byDate = {};
          for (const ev of events) {
            if (!ev.DTSTART) continue;
            // YYYYMMDDTHHMMSS
            const date = ev.DTSTART.slice(0,8);
            if (!byDate[date]) byDate[date] = [];
            byDate[date].push(ev);
          }
          for (const date in byDate) {
            const dayEvents = byDate[date];
            // Try to get title from DESCRIPTION or SUMMARY
            let title = calendarTitle;
            if (!title && dayEvents[0] && dayEvents[0].DESCRIPTION) title = dayEvents[0].DESCRIPTION;
            // Format date for header
            let d = date;
            if (d.length === 8) {
              const yyyy = d.slice(0,4), mm = d.slice(4,6), dd = d.slice(6,8);
              const jsDate = new Date(`${yyyy}-${mm}-${dd}`);
              const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
              title = `${dd}/${mm} ${days[jsDate.getDay()]}`;
            }
            // Create header
            const header = document.createElement('div');
            header.id = 'header';
            header.setAttribute('contenteditable', 'true');
            header.setAttribute('data-placeholder', 'Day');
            header.textContent = title;
            // Create table
            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrapper';
            const table = document.createElement('table');
            table.innerHTML = `<colgroup>
              <col class="handle-col">
              <col class="task-col">
              <col class="interval-col">
              <col class="duration-col">
              <col class="delete-col">
            </colgroup>
            <thead>
              <tr>
                <th></th>
                <th>Task</th>
                <th class="interval-col">SCHEDULE</th>
                <th class="duration-col">DURATION</th>
                <th class="delete-col"></th>
              </tr>
            </thead>
            <tbody></tbody>`;
            const tbody = table.querySelector('tbody');
            for (const ev of dayEvents) {
              // Parse times
              let sh = '--', sm = '--', eh = '--', em = '--', dur = '';
              if (ev.DTSTART && ev.DTEND) {
                sh = ev.DTSTART.slice(9,11);
                sm = ev.DTSTART.slice(11,13);
                eh = ev.DTEND.slice(9,11);
                em = ev.DTEND.slice(11,13);
                // Duration in minutes
                const mins = (parseInt(eh,10)*60+parseInt(em,10))-(parseInt(sh,10)*60+parseInt(sm,10));
                dur = mins > 0 ? mins : '';
              }
              const tr = document.createElement('tr');
              tr.setAttribute('draggable','true');
              tr.innerHTML = `
                <td class="handle-col">≡</td>
                <td class="task-col" contenteditable="true">${ev.SUMMARY||''}</td>
                <td class="interval-col">
                  <input type="checkbox" class="lock-schedule-cb" title="Fix time">
                  <input type="text" class="start-hh" maxlength="2" size="2" placeholder="hh" value="${sh}">:<input type="text" class="start-mm" maxlength="2" size="2" placeholder="mm" value="${sm}">
                  – <span class="auto-end-time">${eh}:${em}</span>
                  <div class="custom-time-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;"></div>
                </td>
                <td class="duration-col"><input type="number" class="duration" min="0" step="10" placeholder="min" value="${dur}"><div class="custom-duration-picker" style="display:none; position:fixed; left:0; top:0; z-index:10000; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 8px #0002; padding:0.5rem;"></div></td>
                <td class="delete-col"><button class="row-delete-btn" title="Delete row">🗑️</button></td>
              `;
              tbody.appendChild(tr);
            }
            wrapper.appendChild(table);
            // Add table buttons
            const btns = document.createElement('div');
            btns.className = 'table-buttons';
            btns.innerHTML = `<div class="add-row-group">
              <button class="add-row-btn" title="Add row">➕</button>
              <div class="add-row-dropdown">
                <button data-rows="2">+ 2 rows</button>
                <button data-rows="3">+ 3 rows</button>
                <button data-rows="4">+ 4 rows</button>
              </div>
            </div>
            <button class="remove-table-btn" title="Delete table" style="background:#c00;">🗒️</button>
            <button class="add-table-btn" title="Add table">🗒️</button>
            <button class="export-ics-btn" title="Export to Calendar" style="background:#1976d2; color:#fff;">📅</button>
            <button class="doc-btn" title="Copy as text" style="background:#1976d2; color:#fff;">📄</button>`;
            wrapper.appendChild(btns);
            // Insert into planner
            container.appendChild(header);
            container.appendChild(wrapper);
            // Re-init logic
            initTable(table);
            enableRowDeleteDelegation();
            initDragAndDrop();
            initAddRowDropdowns();
          }
        }
      })();
    });
  </script>
